name: Sign release artifacts with sigstore

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  sign:
    name: Sign artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Build distribution
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign and verify artifacts with GitHub OIDC
        env:
          CERTIFICATE_IDENTITY: >-
            https://github.com/${{ github.repository }}/.github/workflows/release-sign.yml@${{ github.ref }}
        run: |
          set -euo pipefail
          for artifact in dist/*.tar.gz dist/*.whl; do
            cosign sign-blob --yes --bundle "${artifact}.sigstore.json" "${artifact}"
            cosign verify-blob \
              --bundle "${artifact}.sigstore.json" \
              --certificate-identity "${CERTIFICATE_IDENTITY}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "${artifact}"
          done

      - name: Upload signed artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: signed-dist
          path: |
            ./dist/*.tar.gz
            ./dist/*.tar.gz.sigstore.json
            ./dist/*.whl
            ./dist/*.whl.sigstore.json
