# dependabot.yml — audit-2026-07-04 PR-4 / P1-8
# Daily scan for security updates + weekly for GitHub Actions.
# PR limit: five open updates per ecosystem to avoid PR flooding.
version: 2
updates:
  # ── pip (Python dependencies) ──────────────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    open-pull-requests-limit: 5
    # Group patch + minor updates together to reduce PR count.
    groups:
      patch-and-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # pydantic pins its companion package exactly; updating the transitive
    # lock entry alone creates an uninstallable Dependabot PR.
    ignore:
      - dependency-name: "pydantic-core"
      # MCP 2.x currently breaks server compatibility tests (list_tools API
      # changes). Keep the validated 1.x line until an explicit migration.
      - dependency-name: "mcp"
        update-types:
          - "version-update:semver-major"
      # OpenAI 2.x is a runtime-major upgrade; the project still validates the
      # OpenAI 1.x API and does not yet have an integration migration suite.
      - dependency-name: "openai"
        update-types:
          - "version-update:semver-major"
    # Auto-rebase to keep PRs in sync with main.
    rebase-strategy: "auto"
    labels:
      - "dependencies"

  # ── GitHub Actions ────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "04:00"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    labels:
      - "dependencies"
      - "github-actions"

  # ── Docker (only if Dockerfiles use external base images) ─────────────
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "04:00"
    open-pull-requests-limit: 3
    rebase-strategy: "auto"
    labels:
      - "dependencies"
      - "docker"
