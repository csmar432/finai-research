<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">Start FinAI with your preferred agent</title><desc id="desc">Codex is recommended; Cursor, Claude Code, API providers, and Ollama are supported. Mock is explicit opt-in only.</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0L0 0 0 40" fill="none" stroke="#d8d6cd" opacity=".32"/></pattern></defs>
<rect width="100%" height="100%" fill="#f7f5ef"/>
<rect width="100%" height="100%" fill="url(#grid)"/>
<text x="64" y="68" fill="#10231c" font-size="34" font-weight="720" font-family="'Inter', 'SF Pro Text', 'Segoe UI', system-ui, -apple-system, sans-serif">Start with the agent you already use</text>
<text x="64" y="102" fill="#4f6259" font-size="16" font-family="'Inter', 'SF Pro Text', 'Segoe UI', system-ui, -apple-system, sans-serif">Codex is recommended; Cursor, Claude Code, API providers, and Ollama use the same project protocol.</text>
