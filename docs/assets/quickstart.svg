<text x="920" y="358" fill="#10231c" font-size="25" font-weight="700" font-family="'Inter', 'SF Pro Text', 'Segoe UI', system-ui, -apple-system, sans-serif">Agent host</text>
<text x="920" y="397" fill="#4f6259" font-size="13" font-family="'Inter', 'SF Pro Text', 'Segoe UI', system-ui, -apple-system, sans-serif">Fail closed; writes explicit gap files;</text>
<text x="920" y="418" fill="#4f6259" font-size="13" font-family="'Inter', 'SF Pro Text', 'Segoe UI', system-ui, -apple-system, sans-serif">never enables Mock.</text>
<rect x="920" y="454" width="304" height="88" rx="12" fill="#f2f0e9" stroke="#d8d6cd"/>
<text x="940" y="490" fill="#71558b" font-size="12" font-family="'SF Mono', 'JetBrains Mono', 'Cascadia Code', monospace">python scripts/</text>
<text x="940" y="518" fill="#10231c" font-size="13" font-family="'SF Mono', 'JetBrains Mono', 'Cascadia Code', monospace">agent_host_entry.py</text>
  <g>
    <rect x="920" y="586" width="304" height="34" rx="17" fill="#71558b" fill-opacity="0.08" stroke="#71558b" stroke-opacity="0.72"/>
    <text x="1072.0" y="608" fill="#10231c" font-size="12" text-anchor="middle" font-family="'SF Mono', 'JetBrains Mono', 'Cascadia Code', monospace">Mock is explicit opt-in only</text>
