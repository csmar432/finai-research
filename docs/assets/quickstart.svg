<text x="94" y="800" fill="#10231c" font-size="15" font-family="'SF Mono', 'JetBrains Mono', 'Cascadia Code', monospace">python -m scripts.research_framework.enhanced_pipeline --topic "..." --explore [--panel FILE]</text>
