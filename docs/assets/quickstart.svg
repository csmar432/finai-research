<text x="86" y="162" fill="#0b7a53" font-size="10" font-weight="700" font-family="'SF Mono', 'JetBrains Mono', 'Cascadia Code', monospace">RECOMMENDED</text>
<text x="86" y="198" fill="#10231c" font-size="20" font-weight="700" font-family="'Inter', 'SF Pro Text', 'Segoe UI', system-ui, -apple-system, sans-serif">Codex</text>
