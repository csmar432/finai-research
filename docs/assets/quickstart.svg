<text x="356" y="162" fill="#3659a2" font-size="10" font-weight="700" font-family="'SF Mono', 'JetBrains Mono', 'Cascadia Code', monospace">SUPPORTED</text>
<text x="356" y="198" fill="#10231c" font-size="20" font-weight="700" font-family="'Inter', 'SF Pro Text', 'Segoe UI', system-ui, -apple-system, sans-serif">Cursor</text>
<rect x="604" y="132" width="250" height="92" rx="14" fill="#ffffff" stroke="#71558b"/>
<text x="626" y="162" fill="#71558b" font-size="10" font-weight="700" font-family="'SF Mono', 'JetBrains Mono', 'Cascadia Code', monospace">SUPPORTED</text>
<text x="626" y="198" fill="#10231c" font-size="20" font-weight="700" font-family="'Inter', 'SF Pro Text', 'Segoe UI', system-ui, -apple-system, sans-serif">Claude Code</text>
<rect x="874" y="132" width="462" height="92" rx="14" fill="#ffffff" stroke="#a35b20"/>
<text x="896" y="162" fill="#a35b20" font-size="10" font-weight="700" font-family="'SF Mono', 'JetBrains Mono', 'Cascadia Code', monospace">OPTIONAL</text>
<text x="896" y="198" fill="#10231c" font-size="20" font-weight="700" font-family="'Inter', 'SF Pro Text', 'Segoe UI', system-ui, -apple-system, sans-serif">API / Ollama</text>
  <g>
    <rect x="64" y="284" width="360" height="388" rx="18" fill="#ffffff" stroke="#d8d6cd" stroke-width="1.2"/>
    <rect x="80" y="271" width="184" height="26" rx="13" fill="#f7f5ef" stroke="#0b7a53"/>
    <text x="172.0" y="289" fill="#0b7a53" font-size="12" font-weight="700" text-anchor="middle" font-family="'Inter', 'SF Pro Text', 'Segoe UI', system-ui, -apple-system, sans-serif">01 · RECOMMENDED</text>
  </g>
<text x="92" y="358" fill="#10231c" font-size="25" font-weight="700" font-family="'Inter', 'SF Pro Text', 'Segoe UI', system-ui, -apple-system, sans-serif">Clarify first</text>
